name: ecg_app
description: ESP32-ECG 心电监测手机客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.8
  provider: ^6.1.2
  intl: ^0.19.0
  audioplayers: ^6.7.1  # 警报提示音播放（beep.wav）
  shared_preferences: ^2.5.5  # 设置与历史数据持久化
  http: ^1.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/

  # P2-1：打包 Roboto（tabular figures 用于数字），不依赖运行时下载。
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700