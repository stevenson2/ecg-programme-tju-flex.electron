; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32
; N16R8 = ESP32-S3-WROOM-1-N16R8 (16MB Flash / 8MB Octal PSRAM).
; 4d_systems_esp32s3_gen4_r8n16 是 PlatformIO 内置唯一 R8N16 定义:
; memory_type qio_opi (Quad Flash + Octal PSRAM), flash 80MHz QIO, 自带 -DBOARD_HAS_PSRAM
; 旧 adafruit_qtpy_esp32s3_n4r2 (4MB/2MB QSPI) 会让 8MB Octal PSRAM 失效 + 多烧 tinyuf2.bin
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino
monitor_speed = 115200
board_build.usb_cdc_on_boot = 1
; 16MB 去 OTA 单槽分区表: app 15MB, 双模型仅 ~10% (flash_budget_dual_model.md)
board_build.partitions = partitions/esp32s3_16m_noota.csv
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	; N16R8 板载 LED 假设 GPIO48 (官方 DevKitC-1 布局); 若 LED 不亮/常亮改实际引脚
	-DLED_BUILTIN=48
lib_deps = 
	tanakamasayuki/TensorFlowLite_ESP32@1.0.0
monitor_filters = 
	esp32_exception_decoder
