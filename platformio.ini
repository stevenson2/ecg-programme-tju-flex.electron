; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================
; ESP32-S3 SuperMini N4R2 (ESP32-S3FH4R2)
;   - Flash:  4MB  (Quad SPI)
;   - PSRAM:  2MB  (Quad SPI)
;   - Native USB-C (USB CDC), 板载 LED 常见接 GPIO48
; ============================================================
[env:esp32-s3-n4r2]
platform = espressif32
; 无官方 supermini board 定义，使用最接近的通用 DevKitC-1 作为基础，
; 再通过 flash_size / partitions / memory_type 覆盖为 N4R2 实际参数。
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 460800
board_build.usb_cdc_on_boot = 1
; N4R2: 4MB Quad Flash + 2MB Quad PSRAM，内存类型必须为 qio_qspi
; （不要使用 r8n16 的 qio_opi，否则 PSRAM 无法识别）
board_build.arduino.memory_type = qio_qspi
; 4MB 无 OTA 分区表：app 2.75MB，单/双 INT8 模型均足够
; 若使用带 UF2 bootloader 的 supermini 变体，本表已保留 uf2 分区；
; 若确认无 UF2，可改用精简的 esp32s3_4m_noota.csv 并移除 uf2 分区。
board_build.partitions = partitions/esp32s3_4m_noota.csv
board_build.flash_size = 4MB
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	; 注意：不要在这里加 -DLED_BUILTIN=xx！
	; esp32s3 的 pins_arduino.h 已把 LED_BUILTIN 定义为 static const 变量，
	; 再用命令行宏定义会导致 "expected unqualified-id" 编译错误。
	; 如需强制指定 SuperMini 的 GPIO48 LED，请在 src/main.cpp include 之后
	; #undef LED_BUILTIN / #define LED_BUILTIN 48。
lib_deps = 
	tanakamasayuki/TensorFlowLite_ESP32@1.0.0
monitor_filters = 
	esp32_exception_decoder
