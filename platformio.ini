; PlatformIO Project Configuration File
;
;   Board: ESP32-S3-SUPERMINI (ESP32S3FH4R2)
;   Framework: Arduino
;   BLE: Nordic UART Service (NUS)
;
;   ★ 迁移说明 ★
;   从 ESP32-S3-DevKitM-1 迁移至 ESP32-S3-SUPERMINI
;   芯片: ESP32S3FH4R2 (4MB Flash + 2MB Octal PSRAM)
;   USB: 内置 USB-Serial-JTAG (原外置USB-UART)
;   LED: GPIO48 RGB LED 共阳极 (原单色LED)
;
;   board = adafruit_qtpy_esp32s3_n4r2
;   选择理由: 4MB Flash + 2MB PSRAM 与 ESP32S3FH4R2 完全匹配
;
;   ★ 备选方案 (如编译失败) ★
;   改用以下配置手动覆盖:
;   board = esp32-s3-devkitc-1
;   board_build.flash_size = 4MB
;   board_build.psram_type = opi
;   board_build.memory_type = qio_opi
;
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-supermini]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
monitor_speed = 115200

; USB CDC: 启用内置 USB-Serial-JTAG 虚拟串口
board_build.usb_cdc_on_boot = 1

; Arduino 框架标志
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

; ★ TFLite Micro 推理库依赖 ★
lib_deps =
    tanakamasayuki/TensorFlowLite_ESP32@^0.4.0

; Serial monitor exception decoder
monitor_filters =
    esp32_exception_decoder