<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>真机 ECG 标注工具（误判 / 伪影）</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;margin:0;background:#f4f5f7;font-size:13px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#263238;color:#eee}
#bar select,#bar button,#bar input{font-size:13px}
button{cursor:pointer}
#wrap{position:relative;margin:6px 8px;background:#fff;border:1px solid #ccc}
canvas{display:block;width:100%}
#ov{height:46px;cursor:pointer}
#info{display:flex;gap:10px;margin:0 8px}
#sel,#help{background:#fff;border:1px solid #ccc;padding:6px 8px;flex:1;min-height:90px}
#help{flex:1.3;font-size:12px;line-height:1.55}
kbd{background:#eee;border:1px solid #aaa;border-radius:3px;padding:0 4px;font-size:11px}
.lb{display:inline-block;padding:1px 6px;border-radius:3px;color:#fff;margin-right:3px}
#list{margin:6px 8px;max-height:180px;overflow:auto;background:#fff;border:1px solid #ccc;font-size:12px}
#list div{padding:1px 6px;cursor:pointer;border-bottom:1px solid #f0f0f0}
#list div.cur{background:#fff3c4}
#msg{color:#ffd54f}
</style></head><body>
<div id="bar">
 会话 <select id="sess"></select>
 窗长 <select id="winSel"><option>5</option><option selected>10</option><option>20</option><option>30</option><option>60</option></select> 秒
 <button id="prev">◀ 上一屏</button><button id="next">下一屏 ▶</button>
 幅度 <button id="ampDn">−</button><button id="ampUp">＋</button>
 显示 <label><input type="checkbox" id="showAll" checked>全部拍</label>
 <label><input type="checkbox" id="onlyTodo">列表只看未标</label>
 标注人 <input id="who" size="6" placeholder="姓名">
 <button id="exJ">导出 JSON</button><button id="exC">导出 CSV</button>
 <button id="imp">导入 JSON</button><input type="file" id="impF" accept=".json" style="display:none">
 <button id="clr">清空本会话</button>
 <span id="prog"></span> <span id="msg"></span>
</div>
<div id="wrap"><canvas id="cv" height="380"></canvas><canvas id="ov"></canvas></div>
<div id="info"><div id="sel"></div><div id="help">
<b>快捷键</b>：<kbd>V</kbd>/<kbd>1</kbd> 真室早(V)　<kbd>N</kbd>/<kbd>2</kbd> 正常(N)　<kbd>F</kbd>/<kbd>3</kbd> 误判　<kbd>A</kbd>/<kbd>4</kbd> 伪影　<kbd>U</kbd>/<kbd>5</kbd> 不确定　<kbd>Del</kbd>/<kbd>0</kbd> 清除<br>
<kbd>J</kbd>/<kbd>Tab</kbd> 下一个待标项（被标记的拍 + 报警）　<kbd>K</kbd>/<kbd>Shift+Tab</kbd> 上一个　<kbd>.</kbd>/<kbd>,</kbd> 下一拍/上一拍（含未被标记的拍）<br>
<kbd>←</kbd>/<kbd>→</kbd> 平移半屏　<kbd>PgUp</kbd>/<kbd>PgDn</kbd> 整屏　滚轮 平移　<kbd>Ctrl</kbd>+滚轮 / <kbd>+</kbd><kbd>-</kbd> 幅度　<kbd>[</kbd><kbd>]</kbd> 窗长<br>
鼠标：单击拍/报警线 = 选中；<b>按住拖动 = 标伪影段</b>；右键伪影段 = 删除；<kbd>Alt</kbd>+单击 = 在该处补一个漏检拍（随后按键给标签）<br>
自动保存到浏览器 localStorage；请定期 <b>导出 JSON</b> 备份并交给分析脚本。
</div></div>
<div id="list"></div>
<script src="ecg_annot_data.js"></script>
<script>
"use strict";
const D=window.ECG_DATA; if(!D){document.body.innerHTML='<h2>未找到 ecg_annot_data.js（需与本 HTML 同目录）。先运行 scripts/18_export_annot_data.py</h2>';throw 0;}
const FS=D.fs, THR=D.thr, MODELS=D.models;
const MCOL={student_hard:"#e53935",distill_v2:"#1e88e5",exp5_int8:"#43a047"};
const MSH={student_hard:"SH",distill_v2:"D2",exp5_int8:"E5"};
const LAB={V:["真室早(V)","#d32f2f"],N:["正常(N)","#2e7d32"],FD:["误判","#f57c00"],ART:["伪影","#6d4c41"],UNK:["不确定","#7b1fa2"]};
const KEY={v:"V","1":"V",n:"N","2":"N",f:"FD","3":"FD",a:"ART","4":"ART",u:"UNK","5":"UNK"};
const LSK="ecg_annot_v1";
let store=JSON.parse(localStorage.getItem(LSK)||"null")||{tool:"ecg_annotator v1",sessions:{}};
let S=null,L=null,t0=0,win=10,amp=1,sel=null,items=[],drag=null;
const $=id=>document.getElementById(id), cv=$("cv"), ov=$("ov"), cx=cv.getContext("2d"), ox=ov.getContext("2d");
$("who").value=store.annotator||"";
D.sessions.forEach((s,i)=>{const o=document.createElement("option");o.value=i;o.textContent=`${s.key} · ${s.kind==="leadI"?"标准 Lead I":"可穿戴胸贴"} · ${(s.n_sec/60).toFixed(1)} 分钟`;$("sess").appendChild(o)});
function sess(i){S=D.sessions[i];store.sessions[S.key]=store.sessions[S.key]||{beats:{},manual:{},alarms:{},artifacts:[]};L=store.sessions[S.key];
 S.flag=S.peaks.map((p,j)=>MODELS.some(m=>S.scores[m][j]>=THR));buildItems();t0=0;sel=null;if(items.length)select(items[0]);draw();}
function buildItems(){items=[];S.peaks.forEach((p,j)=>{if(S.flag[j])items.push({t:"beat",j,s:p})});
 MODELS.forEach(m=>S.alarms[m].entries.forEach(e=>items.push({t:"alarm",m,e,s:e*FS})));
 items.sort((a,b)=>a.s-b.s||(a.t==="alarm")-(b.t==="alarm"));renderList();}
function labelOf(it){if(!it)return null;if(it.t==="beat")return L.beats[S.peaks[it.j]]||null;if(it.t==="manual")return L.manual[it.s]||null;return L.alarms[it.m+"@"+it.e]||null}
function setLabel(it,v){if(it.t==="beat"){const k=S.peaks[it.j];v?L.beats[k]=v:delete L.beats[k]}
 else if(it.t==="manual"){v?L.manual[it.s]=v:delete L.manual[it.s]}else{const k=it.m+"@"+it.e;v?L.alarms[k]=v:delete L.alarms[k]}save();}
function save(){store.annotator=$("who").value;store.updated=new Date().toISOString();localStorage.setItem(LSK,JSON.stringify(store));$("msg").textContent="已自动保存 "+new Date().toLocaleTimeString();updProg()}
function updProg(){const done=items.filter(labelOf).length;$("prog").textContent=`待标项 ${done}/${items.length} · 已标拍 ${Object.keys(L.beats).length} · 补拍 ${Object.keys(L.manual).length} · 伪影段 ${L.artifacts.length}`}
function renderList(){const el=$("list");el.innerHTML="";const only=$("onlyTodo").checked;
 items.forEach((it,i)=>{const lb=labelOf(it);if(only&&lb)return;const d=document.createElement("div");
  d.dataset.i=i;d.innerHTML=`${fmt(it.s/FS)} · ${it.t==="beat"?"拍 "+MODELS.map(m=>MSH[m]+"="+S.scores[m][it.j].toFixed(2)).join(" "):"<b style='color:"+MCOL[it.m]+"'>报警进入 "+it.m+"</b>"} ${lb?`<span class=lb style="background:${LAB[lb][1]}">${LAB[lb][0]}</span>`:"<i style='color:#999'>未标</i>"}`;
  if(sel&&same(sel,it))d.className="cur";d.onclick=()=>{select(it);draw()};el.appendChild(d)});updProg()}
function same(a,b){return a.t===b.t&&a.s===b.s&&a.m===b.m}
function fmt(s){const m=Math.floor(s/60);return m+":"+(s%60).toFixed(2).padStart(5,"0")}
function select(it){sel=it;const ts=it.s/FS;if(ts<t0||ts>t0+win)t0=Math.max(0,Math.min(S.n_sec-win,ts-win/2));showSel();}
function showSel(){const el=$("sel");if(!sel){el.innerHTML="未选中";return}const lb=labelOf(sel);
 let h=`<b>${sel.t==="alarm"?"报警进入（"+sel.m+"）":sel.t==="manual"?"补拍（人工）":"检测拍 #"+sel.j}</b> @ ${fmt(sel.s/FS)}（样本 ${sel.s} @250Hz）<br>`;
 if(sel.t==="beat")h+=MODELS.map(m=>`<span style="color:${MCOL[m]}">${m}: ${S.scores[m][sel.j].toFixed(3)}${S.scores[m][sel.j]>=THR?" ⚑":""}</span>`).join("　")+"<br>";
 if(sel.t==="alarm")h+="报警进入 = 该秒 10 s 密度窗内 ≥8 秒被判 V；请判断这一次报警是真 V 事件还是误报/伪影。<br>";
 h+="当前标签："+(lb?`<span class=lb style="background:${LAB[lb][1]}">${LAB[lb][0]}</span>`:"无");el.innerHTML=h;}
function X(s){return (s/FS-t0)/win*cv.width}
function draw(){const W=cv.width=cv.clientWidth*devicePixelRatio,H=cv.height=380*devicePixelRatio;cx.clearRect(0,0,W,H);
 const mid=H*0.55, sc=H*0.32*amp, a=Math.floor(t0*FS), b=Math.min(S.sig.length,Math.ceil((t0+win)*FS));
 // grid
 cx.strokeStyle="#fde0e0";cx.lineWidth=1;for(let t=Math.ceil(t0*5)/5;t<t0+win;t+=0.2){const x=(t-t0)/win*W;cx.lineWidth=Math.abs(t-Math.round(t))<1e-6?2:1;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
 cx.fillStyle="#555";cx.font=`${11*devicePixelRatio}px sans-serif`;for(let t=Math.ceil(t0);t<t0+win;t++)cx.fillText(fmt(t),(t-t0)/win*W+3,H-4);
 // alarm spans
 MODELS.forEach((m,k)=>S.alarms[m].spans.forEach(([s,e])=>{const x0=X(s*FS),x1=X(e*FS);if(x1<0||x0>W)return;cx.fillStyle=MCOL[m]+"22";cx.fillRect(x0,k*10*devicePixelRatio,x1-x0,8*devicePixelRatio)}));
 // artifacts
 L.artifacts.forEach(([s,e])=>{const x0=(s-t0)/win*W,x1=(e-t0)/win*W;if(x1<0||x0>W)return;cx.fillStyle="rgba(109,76,65,0.18)";cx.fillRect(x0,0,x1-x0,H);cx.fillStyle="#6d4c41";cx.fillText("伪影",x0+3,40*devicePixelRatio)});
 if(drag&&drag.moved){const x0=(Math.min(drag.a,drag.b)-t0)/win*W,x1=(Math.max(drag.a,drag.b)-t0)/win*W;cx.fillStyle="rgba(109,76,65,0.3)";cx.fillRect(x0,0,x1-x0,H)}
 // signal
 cx.strokeStyle="#111";cx.lineWidth=1.2*devicePixelRatio;cx.beginPath();for(let i=a;i<b;i++){const x=(i/FS-t0)/win*W,y=mid-S.sig[i]*sc;i===a?cx.moveTo(x,y):cx.lineTo(x,y)}cx.stroke();
 // alarm entries
 MODELS.forEach((m,k)=>S.alarms[m].entries.forEach(e=>{const x=X(e*FS);if(x<0||x>W)return;const lb=L.alarms[m+"@"+e];cx.strokeStyle=MCOL[m];cx.lineWidth=(sel&&sel.t==="alarm"&&sel.m===m&&sel.e===e?4:2)*devicePixelRatio;cx.setLineDash([6,4]);cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke();cx.setLineDash([]);
  cx.fillStyle=MCOL[m];cx.fillText("报警 "+MSH[m]+(lb?" · "+LAB[lb][0]:""),x+3,(52+k*14)*devicePixelRatio)}));
 // beats
 const showAll=$("showAll").checked;
 S.peaks.forEach((p,j)=>{const x=X(p);if(x<-5||x>W+5)return;const lb=L.beats[p],fl=S.flag[j];if(!fl&&!showAll&&!lb)return;
  const y=18*devicePixelRatio+30*devicePixelRatio;cx.fillStyle=lb?LAB[lb][1]:(fl?"#ff1744":"#9e9e9e");
  cx.beginPath();const r=(fl?7:4)*devicePixelRatio;cx.moveTo(x-r,y-r*1.4);cx.lineTo(x+r,y-r*1.4);cx.lineTo(x,y);cx.fill();
  if(fl){cx.font=`${9*devicePixelRatio}px sans-serif`;MODELS.forEach((m,k)=>{const v=S.scores[m][j];cx.fillStyle=v>=THR?MCOL[m]:"#bbb";cx.fillText(MSH[m]+(v*100|0),x-12*devicePixelRatio,H-(20+k*11)*devicePixelRatio)});cx.font=`${11*devicePixelRatio}px sans-serif`}
  if(lb){cx.fillStyle=LAB[lb][1];cx.fillText(LAB[lb][0],x-14*devicePixelRatio,y+14*devicePixelRatio)}
  if(sel&&sel.t==="beat"&&sel.j===j){cx.strokeStyle="#ffab00";cx.lineWidth=3*devicePixelRatio;cx.strokeRect(x-12*devicePixelRatio,4,24*devicePixelRatio,H-8)}});
 Object.entries(L.manual).forEach(([p,lb])=>{const x=X(+p);if(x<0||x>W)return;cx.strokeStyle=LAB[lb]?LAB[lb][1]:"#00897b";cx.lineWidth=2*devicePixelRatio;cx.strokeRect(x-6*devicePixelRatio,30*devicePixelRatio,12*devicePixelRatio,12*devicePixelRatio);cx.fillStyle="#00897b";cx.fillText("补"+(LAB[lb]?LAB[lb][0]:""),x+8*devicePixelRatio,42*devicePixelRatio);
  if(sel&&sel.t==="manual"&&sel.s==+p){cx.strokeStyle="#ffab00";cx.lineWidth=3*devicePixelRatio;cx.strokeRect(x-12*devicePixelRatio,4,24*devicePixelRatio,H-8)}});
 drawOv();showSel();renderListCur();}
function renderListCur(){[...$("list").children].forEach(d=>{const it=items[+d.dataset.i];d.className=sel&&same(sel,it)?"cur":"";if(d.className)d.scrollIntoView({block:"nearest"})})}
function drawOv(){const W=ov.width=ov.clientWidth*devicePixelRatio,H=ov.height=46*devicePixelRatio;ox.clearRect(0,0,W,H);ox.fillStyle="#eceff1";ox.fillRect(0,0,W,H);
 const n=S.n_sec;L.artifacts.forEach(([s,e])=>{ox.fillStyle="rgba(109,76,65,.5)";ox.fillRect(s/n*W,0,Math.max(2,(e-s)/n*W),H)});
 MODELS.forEach((m,k)=>{S.alarms[m].spans.forEach(([s,e])=>{ox.fillStyle=MCOL[m]+"66";ox.fillRect(s/n*W,k*H/3,(e-s)/n*W,H/3)});S.alarms[m].entries.forEach(e=>{ox.fillStyle=L.alarms[m+"@"+e]?"#000":MCOL[m];ox.fillRect(e/n*W-1,k*H/3,3,H/3)})});
 S.peaks.forEach((p,j)=>{if(!S.flag[j])return;const lb=L.beats[p];ox.fillStyle=lb?LAB[lb][1]:"#ff1744";ox.fillRect(p/FS/n*W,H-6,2,6)});
 ox.strokeStyle="#000";ox.lineWidth=2;ox.strokeRect(t0/n*W,1,win/n*W,H-2);}
function tAt(ev){const r=cv.getBoundingClientRect();return t0+(ev.clientX-r.left)/r.width*win}
function nearest(t){const s=t*FS,tol=0.15*FS;let best=null,bd=tol;
 MODELS.forEach(m=>S.alarms[m].entries.forEach(e=>{const d=Math.abs(e*FS-s);if(d<bd*0.5){bd=d*2;best={t:"alarm",m,e,s:e*FS}}}));
 S.peaks.forEach((p,j)=>{const d=Math.abs(p-s);if(d<bd){bd=d;best={t:"beat",j,s:p}}});
 Object.keys(L.manual).forEach(p=>{const d=Math.abs(+p-s);if(d<bd){bd=d;best={t:"manual",s:+p}}});return best}
cv.addEventListener("mousedown",ev=>{if(ev.button!==0)return;drag={a:tAt(ev),b:tAt(ev),moved:false,x:ev.clientX}});
window.addEventListener("mousemove",ev=>{if(!drag)return;drag.b=tAt(ev);if(Math.abs(ev.clientX-drag.x)>5)drag.moved=true;if(drag.moved)draw()});
window.addEventListener("mouseup",ev=>{if(!drag)return;const d=drag;drag=null;
 if(d.moved){const a=Math.max(0,Math.min(d.a,d.b)),b=Math.min(S.n_sec,Math.max(d.a,d.b));if(b-a>0.05){L.artifacts.push([+a.toFixed(3),+b.toFixed(3)]);L.artifacts.sort((x,y)=>x[0]-y[0]);save()}draw();return}
 if(ev.altKey){const s=Math.round(d.a*FS);L.manual[s]=L.manual[s]||"";sel={t:"manual",s};save();draw();return}
 const it=nearest(d.a);if(it){sel=it;draw()}});
cv.addEventListener("contextmenu",ev=>{ev.preventDefault();const t=tAt(ev);const i=L.artifacts.findIndex(([a,b])=>t>=a&&t<=b);
 if(i>=0&&confirm(`删除伪影段 ${fmt(L.artifacts[i][0])}–${fmt(L.artifacts[i][1])}？`)){L.artifacts.splice(i,1);save();draw()}
 else if(sel&&sel.t==="manual"&&Math.abs(sel.s/FS-t)<0.2&&confirm("删除该补拍？")){delete L.manual[sel.s];sel=null;save();draw()}});
cv.addEventListener("wheel",ev=>{ev.preventDefault();if(ev.ctrlKey){amp*=ev.deltaY<0?1.15:1/1.15}else{t0=clampT(t0+Math.sign(ev.deltaY)*win*0.2)}draw()},{passive:false});
ov.addEventListener("click",ev=>{const r=ov.getBoundingClientRect();t0=clampT((ev.clientX-r.left)/r.width*S.n_sec-win/2);draw()});
function clampT(t){return Math.max(0,Math.min(Math.max(0,S.n_sec-win),t))}
function step(dir,onlyFlag){const cur=sel?sel.s:t0*FS;
 if(onlyFlag){const list=items;let k=dir>0?list.findIndex(it=>it.s>cur||(sel&&it.s===cur&&!same(it,sel)&&list.indexOf(it)>list.findIndex(x=>same(x,sel)))):-1;
  if(dir<0){for(let i=list.length-1;i>=0;i--){const it=list[i];if(it.s<cur||(sel&&it.s===cur&&i<list.findIndex(x=>same(x,sel)))){k=i;break}}}
  if(k>=0)select(list[k]);}
 else{let j=dir>0?S.peaks.findIndex(p=>p>cur):-1;if(dir<0){for(let i=S.peaks.length-1;i>=0;i--)if(S.peaks[i]<cur){j=i;break}}if(j>=0)select({t:"beat",j,s:S.peaks[j]})}
 draw()}
document.addEventListener("keydown",ev=>{if(ev.target.tagName==="INPUT")return;const k=ev.key.toLowerCase();
 if(KEY[k]&&sel){setLabel(sel,KEY[k]);renderList();if(sel.t!=="manual"&&items.some(it=>same(it,sel)))step(1,true);else draw();ev.preventDefault();return}
 if((k==="delete"||k==="backspace"||k==="0")&&sel){setLabel(sel,null);renderList();draw();ev.preventDefault();return}
 if(k==="j"||(k==="tab"&&!ev.shiftKey)){step(1,true);ev.preventDefault()}else if(k==="k"||(k==="tab"&&ev.shiftKey)){step(-1,true);ev.preventDefault()}
 else if(k==="."){step(1,false)}else if(k===","){step(-1,false)}
 else if(k==="arrowright"){t0=clampT(t0+win/2);draw()}else if(k==="arrowleft"){t0=clampT(t0-win/2);draw()}
 else if(k==="pagedown"){t0=clampT(t0+win);draw()}else if(k==="pageup"){t0=clampT(t0-win);draw()}
 else if(k==="+"||k==="="){amp*=1.2;draw()}else if(k==="-"){amp/=1.2;draw()}
 else if(k==="]"){setWin(Math.min(60,win*2))}else if(k==="["){setWin(Math.max(2.5,win/2))}});
function setWin(w){win=w;$("winSel").value=[5,10,20,30,60].includes(w)?w:$("winSel").value;t0=clampT(t0);draw()}
$("winSel").onchange=e=>setWin(+e.target.value);$("prev").onclick=()=>{t0=clampT(t0-win);draw()};$("next").onclick=()=>{t0=clampT(t0+win);draw()};
$("ampUp").onclick=()=>{amp*=1.2;draw()};$("ampDn").onclick=()=>{amp/=1.2;draw()};$("showAll").onchange=draw;$("onlyTodo").onchange=renderList;
$("sess").onchange=e=>sess(+e.target.value);$("who").onchange=save;
function dl(name,txt,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function stamp(){return new Date().toISOString().slice(0,16).replace(/[-:T]/g,"")}
function fullExport(){const o=JSON.parse(JSON.stringify(store));o.annotator=$("who").value;o.exported=new Date().toISOString();o.detector=D.detector;o.thr=THR;o.fs=FS;o.label_codes={V:"真室早",N:"正常",FD:"误判(非真实拍/检测或分类错误)",ART:"伪影",UNK:"不确定"};
 o.session_meta={};D.sessions.forEach(s=>o.session_meta[s.key]={file:s.file,n_sec:s.n_sec,n_peaks:s.peaks.length});return o}
$("exJ").onclick=()=>dl(`ecg_labels_${$("who").value||"anon"}_${stamp()}.json`,JSON.stringify(fullExport(),null,1),"application/json");
$("exC").onclick=()=>{const r=["session,type,model,sample_250,time_s,end_s,label"];Object.entries(store.sessions).forEach(([k,l])=>{
 Object.entries(l.beats).forEach(([p,v])=>r.push([k,"beat","",p,(p/FS).toFixed(3),"",v].join(",")));
 Object.entries(l.manual).forEach(([p,v])=>r.push([k,"manual_beat","",p,(p/FS).toFixed(3),"",v].join(",")));
 Object.entries(l.alarms).forEach(([mk,v])=>{const[m,e]=mk.split("@");r.push([k,"alarm",m,e*FS,e,"",v].join(","))});
 l.artifacts.forEach(([a,b])=>r.push([k,"artifact","",Math.round(a*FS),a,b,"ART"].join(",")))});
 dl(`ecg_labels_${$("who").value||"anon"}_${stamp()}.csv`,"\ufeff"+r.join("\n"),"text/csv")};
$("imp").onclick=()=>$("impF").click();
$("impF").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.sessions){alert("不是本工具导出的 JSON");return}
 if(!confirm("导入将覆盖浏览器里同名会话的标注，继续？"))return;Object.assign(store.sessions,o.sessions);if(o.annotator)$("who").value=o.annotator;save();sess(+$("sess").value)})};
$("clr").onclick=()=>{if(confirm("确定清空本会话全部标注？（建议先导出备份）")){store.sessions[S.key]={beats:{},manual:{},alarms:{},artifacts:[]};save();sess(+$("sess").value)}};
